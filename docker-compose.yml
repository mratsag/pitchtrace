# PitchTrace — public alpha
name: pitchtrace
# Varsayılan olarak HİÇBİR servis host'a port açmaz.
# Geliştirme için: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    container_name: pitchtrace-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitchtrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pitchtrace}
    volumes:
      - pitchtrace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pitchtrace} -d ${POSTGRES_DB:-pitchtrace}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pitchtrace]

  analyzer:
    container_name: pitchtrace-analyzer
    build:
      context: ./services/analyzer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pitchtrace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pitchtrace}
      ANALYZER_API_KEY: ${ANALYZER_API_KEY:?ANALYZER_API_KEY is required}
      RUN_MIGRATIONS_ON_BOOT: 'true'
      MIGRATIONS_DIR: /migrations
      ARTIFACT_ROOT: /data
      AUDIT_CONCURRENCY: ${AUDIT_CONCURRENCY:-2}
      # SSRF_ALLOW_LOOPBACK bilerek tanımlanmaz: üretimde kapalıdır.
    volumes:
      - ./database/migrations:/migrations:ro
      - ./data:/data
    # Host'a port AÇILMAZ. Erişim yalnızca `pitchtrace` ağı üzerindendir.
    expose:
      - '8080'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [pitchtrace]

  # Optional F0/F8 stack. Kept behind a profile so existing analyzer-only
  # installations do not acquire a new database or credentials unexpectedly.
  n8n-postgres:
    profiles: [n8n]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-}
      POSTGRES_DB: n8n
    volumes:
      - pitchtrace-n8n-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n -d n8n']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    networks: [pitchtrace]

  n8n:
    profiles: [n8n]
    image: docker.n8n.io/n8nio/n8n:2.39.10
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: '5678'
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_UNVERIFIED_PACKAGES_ENABLED: 'false'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
    volumes:
      - pitchtrace-n8n-data:/home/node/.n8n
    expose: ['5678']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [pitchtrace]

volumes:
  pitchtrace-postgres-data:
    name: pitchtrace-postgres-data
  pitchtrace-n8n-postgres-data:
    name: pitchtrace-n8n-postgres-data
  pitchtrace-n8n-data:
    name: pitchtrace-n8n-data

networks:
  pitchtrace:
    name: pitchtrace-network
    driver: bridge
