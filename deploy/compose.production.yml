name: pitchtrace-production
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes: [analyzer-db:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U pitchtrace -d pitchtrace"], interval: 5s, timeout: 5s, retries: 20 }
    networks: [backend]
  analyzer:
    build: ../services/analyzer
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://pitchtrace:${POSTGRES_PASSWORD}@postgres:5432/pitchtrace
      NODE_ENV: production
      RUN_MIGRATIONS_ON_BOOT: "true"
      MIGRATIONS_DIR: /migrations
      ARTIFACT_ROOT: /data
    volumes: [../database/migrations:/migrations:ro, artifacts:/data]
    expose: ["8080"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10, start_period: 20s }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend, proxy]
  n8n-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes: [n8n-db:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U n8n -d n8n"], interval: 5s, timeout: 5s, retries: 20 }
    networks: [backend]
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.10
    restart: unless-stopped
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    volumes: [n8n-data:/home/node/.n8n]
    expose: ["5678"]
    depends_on: { n8n-postgres: { condition: service_healthy }, analyzer: { condition: service_started } }
    healthcheck: { test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 20, start_period: 30s }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend, proxy]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [proxy]
volumes: { analyzer-db: {}, artifacts: {}, n8n-db: {}, n8n-data: {}, caddy-data: {}, caddy-config: {} }
networks: { backend: { internal: true }, proxy: {} }
