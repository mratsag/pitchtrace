# Geliştirme override'ı — portları YALNIZCA localhost'a açar.
# Kullanım:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Üretimde bu dosya kullanılmaz.

services:
  postgres:
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'

  analyzer:
    ports:
      - '127.0.0.1:${ANALYZER_HOST_PORT:-8080}:8080'
    environment:
      LOG_LEVEL: debug

  n8n:
    ports:
      - '127.0.0.1:${N8N_HOST_PORT:-5678}:5678'
    environment:
      N8N_SECURE_COOKIE: 'false'
