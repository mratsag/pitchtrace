# TEST-ONLY disposable stack for real n8n retry and Form/preview verification.
#
# Never merge this file with docker-compose.yml or deploy/compose.production.yml.
# Start it only through scripts/test-n8n-runtime.sh, which supplies a unique
# Compose project name (`-p`) and runtime-generated throwaway secrets.
#
# Isolation guarantees:
# - no `container_name`, no explicit volume/network names: every resource is
#   prefixed with the unique project name and removed with `down -v`;
# - every service joins one `internal: true` network (no Internet egress);
# - no service publishes a host port;
# - databases and artifacts live on tmpfs;
# - no Docker socket or host data directory is mounted.

x-hardening: &hardening
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

x-analyzer-image: &analyzer-image
  image: pitchtrace-n8n-runtime-analyzer:local
  build:
    context: ../../services/analyzer

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: n8n-db
  DB_POSTGRESDB_PORT: '5432'
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${RT_N8N_DB_PASSWORD:?generated by scripts/test-n8n-runtime.sh}
  N8N_ENCRYPTION_KEY: ${RT_N8N_ENCRYPTION_KEY:?generated by scripts/test-n8n-runtime.sh}
  # Chromium reaches n8n as http://localhost:5678, a secure context: n8n 2.39
  # always marks its Form OAuth session cookie `Secure`, which browsers drop on
  # plain-http non-localhost origins. Production runs behind HTTPS instead.
  N8N_HOST: localhost
  N8N_PORT: '5678'
  N8N_PROTOCOL: http
  N8N_EDITOR_BASE_URL: http://localhost:5678/
  N8N_WEBHOOK_URL: http://localhost:5678/
  N8N_SECURE_COOKIE: 'false'
  N8N_DIAGNOSTICS_ENABLED: 'false'
  N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
  N8N_TEMPLATES_ENABLED: 'false'
  N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
  N8N_UNVERIFIED_PACKAGES_ENABLED: 'false'
  N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
  N8N_PERSONALIZATION_ENABLED: 'false'
  EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
  EXECUTIONS_DATA_SAVE_ON_ERROR: all
  GENERIC_TIMEZONE: UTC

services:
  analyzer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pitchtrace
      POSTGRES_PASSWORD: ${RT_ANALYZER_DB_PASSWORD:?generated by scripts/test-n8n-runtime.sh}
      POSTGRES_DB: pitchtrace_runtime
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pitchtrace -d pitchtrace_runtime]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [rt]

  # The real analyzer. Only the fault proxy and the test runner address it by
  # this name; n8n reaches it exclusively through the proxy below.
  analyzer-upstream:
    <<: [*analyzer-image, *hardening]
    depends_on:
      analyzer-db: { condition: service_healthy }
    environment:
      # NODE_ENV=test is required for the loopback-only fixture site; the
      # analyzer refuses SSRF_ALLOW_LOOPBACK when NODE_ENV=production.
      NODE_ENV: test
      DATABASE_URL: postgres://pitchtrace:${RT_ANALYZER_DB_PASSWORD}@analyzer-db:5432/pitchtrace_runtime
      ANALYZER_API_KEY: ${RT_ANALYZER_API_KEY:?generated by scripts/test-n8n-runtime.sh}
      PREVIEW_TOKEN_SECRET: ${RT_PREVIEW_TOKEN_SECRET:?generated by scripts/test-n8n-runtime.sh}
      # TEST-ONLY: the analyzer's minimum TTLs (60 s read / 300 s refresh).
      # Production defaults stay 600 s / 3600 s in services/analyzer/src/config.ts.
      PREVIEW_TOKEN_TTL_SECONDS: '60'
      PREVIEW_REFRESH_TTL_SECONDS: '300'
      PUBLIC_BASE_URL: http://preview.pitchtrace.test:8080
      RUN_MIGRATIONS_ON_BOOT: 'true'
      MIGRATIONS_DIR: /migrations
      ARTIFACT_ROOT: /data
      SSRF_ALLOW_LOOPBACK: '1'
      SSRF_PIN_DNS: '0'
      PER_DOMAIN_MIN_INTERVAL_MS: '0'
      PERF_MEASURE_WINDOW_MS: '300'
      PERF_SETTLE_MS: '200'
      JOB_IDLE_POLL_MS: '200'
      LOG_LEVEL: warn
    extra_hosts:
      # Reserved test domain served by the loopback-only fixture sidecar.
      - site.pitchtrace.test:127.0.0.1
    volumes:
      - ../../database/migrations:/migrations:ro
    tmpfs:
      # pwuser in the Playwright base image is uid/gid 1001.
      - /data:uid=1001,gid=1001,mode=0700
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    networks:
      rt:
        # Stands in for the production HTTPS preview origin that the reverse
        # proxy maps to /artifact-previews/* and /artifact-preview-refresh/*.
        aliases: [preview.pitchtrace.test]

  # Fictional company website. Shares the analyzer's network namespace and
  # binds 127.0.0.1 only, so it is reachable solely by the analyzer's
  # loopback-restricted test crawler.
  site:
    <<: [*analyzer-image, *hardening]
    network_mode: service:analyzer-upstream
    depends_on:
      analyzer-upstream: { condition: service_started }
    command: [node, /work/tests/n8n-runtime/fixture-site.mjs]
    volumes:
      - ./fixture-site.mjs:/work/tests/n8n-runtime/fixture-site.mjs:ro
      - ./site:/site-runtime:ro
      - ../../services/analyzer/tests/fixtures/site:/site:ro

  # TEST-ONLY fault injector. It owns the `analyzer` hostname on this private
  # network so the unmodified workflow URL http://analyzer:8080 reaches it.
  # It forwards only to the hard-coded analyzer-upstream origin.
  fault-proxy:
    <<: [*analyzer-image, *hardening]
    command: [node, /work/tests/n8n-runtime/fault-proxy.mjs]
    environment:
      FAULT_CONTROL_TOKEN: ${RT_FAULT_CONTROL_TOKEN:?generated by scripts/test-n8n-runtime.sh}
    volumes:
      - ./fault-proxy.mjs:/work/tests/n8n-runtime/fault-proxy.mjs:ro
    depends_on:
      analyzer-upstream: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      rt:
        aliases: [analyzer]

  n8n-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${RT_N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U n8n -d n8n]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [rt]

  n8n:
    <<: *hardening
    image: docker.n8n.io/n8nio/n8n:2.39.10
    depends_on:
      n8n-db: { condition: service_healthy }
    environment: *n8n-env
    tmpfs:
      - /home/node/.n8n:uid=1000,gid=1000,mode=0700
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 15s
    networks: [rt]

  # One-off n8n CLI container: builds the runtime bundle and imports/publishes
  # it (same image, DB and encryption key as `n8n`). The bundle, including the
  # throwaway credential, lives only on this container's tmpfs.
  n8n-cli:
    <<: *hardening
    profiles: [cli]
    image: docker.n8n.io/n8nio/n8n:2.39.10
    depends_on:
      n8n-db: { condition: service_healthy }
    entrypoint: [sh, -eu, -c]
    environment:
      <<: *n8n-env
      RT_ANALYZER_API_KEY: ${RT_ANALYZER_API_KEY}
      RT_N8N_CREDENTIAL_ID: ${RT_N8N_CREDENTIAL_ID:?generated by scripts/test-n8n-runtime.sh}
      RT_TEST_POLL_SECONDS: '3'
    volumes:
      - ../../workflows:/work/workflows:ro
      - ./:/work/tests/n8n-runtime:ro
    tmpfs:
      - /home/node/.n8n:uid=1000,gid=1000,mode=0700
      - /bootstrap:uid=1000,gid=1000,mode=0700
    networks: [rt]

  # Test runner: retry scenarios and the Chromium Form test. It joins n8n's
  # network namespace so the browser uses http://localhost:5678; every other
  # service is still resolved by name on the internal network.
  runner:
    <<: [*analyzer-image, *hardening]
    profiles: [runner]
    network_mode: service:n8n
    working_dir: /work
    environment:
      RT_ANALYZER_API_KEY: ${RT_ANALYZER_API_KEY}
      RT_PREVIEW_TOKEN_SECRET: ${RT_PREVIEW_TOKEN_SECRET}
      RT_ANALYZER_DB_URL: postgres://pitchtrace:${RT_ANALYZER_DB_PASSWORD}@analyzer-db:5432/pitchtrace_runtime
      RT_N8N_ENCRYPTION_KEY: ${RT_N8N_ENCRYPTION_KEY}
      RT_N8N_DB_PASSWORD: ${RT_N8N_DB_PASSWORD}
      RT_N8N_OWNER_PASSWORD: ${RT_N8N_OWNER_PASSWORD:?generated by scripts/test-n8n-runtime.sh}
      RT_N8N_CREDENTIAL_ID: ${RT_N8N_CREDENTIAL_ID}
      RT_FAULT_CONTROL_TOKEN: ${RT_FAULT_CONTROL_TOKEN}
    volumes:
      - ./:/work/tests/n8n-runtime:ro
      - ../../test-results/n8n-runtime:/out
    tmpfs: [/tmp]

networks:
  rt:
    internal: true
