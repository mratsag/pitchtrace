<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ornek Klinik - Agir Sayfa Ornegi</title>
  <meta name="description" content="Bu fixture sayfa agirligi esigini asmak icin buyuk bir kaynak yukleyen ornek sayfadir.">
</head>
<body style="margin:0;font-family:sans-serif;font-size:16px">
  <h1>Agir sayfa</h1>
  <script>
    var params = new URLSearchParams(location.search);
    var bytes = parseInt(params.get('bytes') || '1500000', 10);
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = '/bytes/' + bytes;
    document.head.appendChild(link);
  </script>
</body>
</html>
