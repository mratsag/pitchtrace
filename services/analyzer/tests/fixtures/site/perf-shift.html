<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ornek Klinik - Kayan Yerlesim Ornegi</title>
  <meta name="description" content="Bu fixture yuklenme sirasinda icerik kaymasini (CLS) olcmek icin hazirlanmis ornek sayfadir.">
</head>
<body style="margin:0;font-family:sans-serif;font-size:16px">
  <h1>Kayan yerlesim</h1>
  <p id="icerik">Bu paragraf banner eklendiginde asagi kayacak.</p>
  <script>
    var params = new URLSearchParams(location.search);
    var delay = parseInt(params.get('delay') || '300', 10);
    setTimeout(function () {
      var banner = document.createElement('div');
      banner.style.cssText = 'width:100%;height:500px;background:#eee';
      banner.textContent = 'Sonradan eklenen banner';
      document.body.insertBefore(banner, document.body.firstChild);
    }, delay);
  </script>
</body>
</html>
